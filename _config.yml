# =============================================================
# 方木雁的个人博客 — Hexo 站点配置
# 部署前必改：url（你的最终域名或 Pages 地址）
# =============================================================

# ---------------- 站点信息 ----------------
title: 方木雁
subtitle: 代码改变世界 — 全栈开发 · AI 工程 · 安全研究
description: 代码改变世界。专注全栈开发、AI 工程与安全研究，分享技术洞察与实战经验。
keywords: 方木雁, 全栈开发, AI 工程, 安全研究, 博客
author: 方木雁
language: zh-CN
timezone: Asia/Shanghai

# ---------------- URL ----------------
# 部署后改成你的真实地址，例如：
#   Cloudflare Pages: https://fangmuyan.pages.dev
#   自定义域名:       https://fangmuyan.com
#   GitHub Pages:     https://你的用户名.github.io
url: https://fangmuyan.pages.dev
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------------- 目录 ----------------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------------- 写作 ----------------
new_post_name: :title.md
default_layout: post
titlecase: false
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: true
prismjs:
  enable: false

# ---------------- 首页生成 ----------------
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ---------------- 分类 & 标签 ----------------
default_category: uncategorized
category_map:
tag_map:

# ---------------- 元信息 ----------------
meta_generator: true

# ---------------- 日期格式 ----------------
date_format: YYYY/M/D
time_format: HH:mm:ss
updated_option: mtime

# ---------------- 分页 ----------------
per_page: 10
pagination_dir: page

# ---------------- 主题 ----------------
theme: coderliang

# ---------------- RSS 订阅（hexo-generator-feed） ----------------
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit:
  content_limit_delim: ' '

# ---------------- 本地搜索（hexo-generator-search） ----------------
search:
  path: search.json
  field: post
  content: true
  format: raw
